name: Daily DSE Stock Scan

on:
  schedule:
    - cron: '0 9 * * 0-4' # Sunday to Thursday at 3:00 PM BD time
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Ensure historical_cache exists (it may be empty on first run)
      - name: Prepare cache folder
        run: mkdir -p historical_cache Stock_Report/bangla_summary

      - name: Run DSE Scanner
        run: python scanner.py

      # NEW: Save any new cache files back to the repo
      - name: Save historical cache to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add historical_cache/ || true
          git diff --staged --quiet || git commit -m "Update historical cache [skip ci]"
          git push || true

      # Clean up old HTML reports before making index
      - name: Clean old reports
        run: |
          cd Stock_Report/bangla_summary
          ls -t *.html 2>/dev/null | tail -n +2 | xargs -r rm -f

      - name: Set Latest Report as Homepage
        run: |
          cd Stock_Report/bangla_summary
          LATEST_FILE=$(ls -t *.html | head -n 1)
          echo "Copying $LATEST_FILE to index.html"
          cp "$LATEST_FILE" index.html

      - name: Upload Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dse-scan-report
          path: Stock_Report/bangla_summary/
          if-no-files-found: error

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'Stock_Report/bangla_summary/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
