name: Daily DSE Stock Scan

on:
  # 1. Schedule the job
  schedule:
    # Runs at 9:30 AM UTC, which is 3:30 PM in Bangladesh (UTC+6).
    # DSE closes at 2:30 PM, so this runs 1 hour after closing.
    - cron: '30 9 * * 1-5' # Monday to Friday
  # 2. Allow manual triggering from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out your repository's code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up the Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Step 3: Install the required libraries
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run your scanner script
      - name: Run DSE Scanner
        run: python scanner.py

      # Step 5: Ensure the report directory exists
      - name: Ensure Report Directory Exists
        run: mkdir -p Stock_Report/bangla_summary

      # Step 6: Upload the generated report as a workflow artifact
      - name: Upload Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dse-scan-report
          path: Stock_Report/bangla_summary/
          if-no-files-found: error

      # Step 7: Deploy the report to GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'Stock_Report/bangla_summary/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
