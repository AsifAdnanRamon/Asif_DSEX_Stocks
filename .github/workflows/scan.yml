name: Daily DSE Stock Scan

on:
  schedule:
    # Runs every 15 minutes between 4:00 AM - 8:00 AM UTC (10:00 AM - 2:00 PM BD time)
    # Sunday to Thursday (0-4)
    - cron: '*/15 4-8 * * 0-4'
  # Allows you to run it manually from the Actions tab for testing
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true  # Cancels an old run if a new one starts

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # THIS IS THE CLEANUP STEP - DELETES OLD REPORTS TO KEEP ONLY NEWEST
      - name: Clean old reports and prepare folder
        run: |
          mkdir -p Stock_Report/bangla_summary
          rm -f Stock_Report/bangla_summary/*.html

      - name: Run DSE Scanner
        run: python scanner.py

      # THIS COPIES THE NEWEST REPORT TO index.html
      - name: Set Latest Report as Homepage
        run: |
          cd Stock_Report/bangla_summary
          LATEST_FILE=$(ls -t *.html | head -n 1)
          echo "Copying $LATEST_FILE to index.html"
          cp "$LATEST_FILE" index.html

      - name: Upload Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dse-scan-report
          path: Stock_Report/bangla_summary/
          if-no-files-found: error

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'Stock_Report/bangla_summary/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
