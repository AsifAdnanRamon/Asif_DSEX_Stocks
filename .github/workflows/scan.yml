name: Daily DSE Stock Scan

on:
  schedule:
    # Runs at 9:00 AM UTC, which is 3:00 PM in Bangladesh (UTC+6).
    # Sunday to Thursday (0-4). DSE closes at 2:00 PM, so this runs 1 hour after closing.
    - cron: '0 9 * * 0-4'
  # Allows you to run it manually from the Actions tab for testing
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DSE Scanner
        run: python scanner.py

      - name: Ensure Report Directory Exists
        run: mkdir -p Stock_Report/bangla_summary

      - name: Upload Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dse-scan-report
          path: Stock_Report/bangla_summary/
          if-no-files-found: error

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'Stock_Report/bangla_summary/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
